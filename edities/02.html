<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7e6fa">
<title>editie 02 - tiramisu</title>
<link rel="stylesheet" href="../style.css">

<style>
  /* ---------- editie 02: alleen voor deze pagina ---------- */
  .editie-02 {
    --roze: #f7e6fa;
    --roze-donker: #eed3f3;   /* het "lege vakje" in het bakje */
    --cacao: #5a2a10;
    --room: #fff6e6;

    background: var(--roze);
    color: var(--cacao);
    margin: 0;
    min-height: 100vh;
  }

  /* titel blijft in de code voor schermlezers, maar is niet zichtbaar */
  .verborgen {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }

  /* ---------- het bakje: 2 kolommen x 3 rijen ---------- */
  .tray {
    width: min(92vw, 460px);
    margin: 2rem auto 2rem;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
  }

  .piece {
    position: relative;
    display: block;
    width: 100%;
    aspect-ratio: 534 / 497;      /* zelfde verhouding als tiramisupiece.png */
    padding: 0;
    border: 0;
    background: none;
    font: inherit;
    color: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  /* kleine verschuivingen zodat het er niet te "perfect" uitziet,
     zoals in je ontwerp */
  .piece:nth-child(1) { transform: rotate(-.8deg); }
  .piece:nth-child(2) { transform: rotate(.6deg)  translateY(2px); }
  .piece:nth-child(3) { transform: rotate(.5deg)  translateX(2px); }
  .piece:nth-child(4) { transform: rotate(-.6deg) translateY(-2px); }
  .piece:nth-child(5) { transform: rotate(-.4deg); }
  .piece:nth-child(6) { transform: rotate(.9deg)  translateX(-2px); }

  /* leeg vakje dat zichtbaar wordt als het stukje weg is */
  .piece::before {
    content: "";
    position: absolute;
    inset: 6%;
    border-radius: 6px;
    background: var(--roze-donker);
    opacity: 0;
    transition: opacity .4s ease;
  }

  /* het stukje zelf
     --rot = draaiing van het stukje, --fit = kleine verkleining als het
     stukje gedraaid is, zodat het precies in het vakje past */
  .piece img {
    --rot: 0deg;
    --fit: 1;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    transform: rotate(var(--rot)) scale(var(--fit));
    transition: opacity .45s ease, transform .6s cubic-bezier(.2, .8, .2, 1), filter .45s ease;
    user-select: none;
    -webkit-user-drag: none;
  }

  /* de middelste stukjes zijn 90 graden gedraaid
     (mobiel: stukje 3 en 4, de middelste rij) */
  .piece:nth-child(3) img,
  .piece:nth-child(4) img {
    --rot: 90deg;
    --fit: .93;
  }

  /* de tekst die verschijnt */
  .piece .label {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12%;
    text-align: center;
    line-height: 1.25;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .35s ease .15s, transform .45s ease .15s;
    pointer-events: none;
  }
  .label strong { font-size: 1.05rem; }
  .label span   { font-size: .85rem; margin-top: .3rem; }

  /* ---------- hover / toetsenbord / tikken ---------- */
  .piece:hover img,
  .piece:focus-visible img,
  .piece.open img {
    opacity: 0;
    transform: translateY(10px) rotate(calc(var(--rot) - 4deg)) scale(calc(var(--fit) * .88));
    filter: blur(2px);
  }
  .piece:hover::before,
  .piece:focus-visible::before,
  .piece.open::before { opacity: 1; }

  .piece:hover .label,
  .piece:focus-visible .label,
  .piece.open .label {
    opacity: 1;
    transform: translateY(0);
  }

  .piece:focus-visible {
    outline: 3px solid var(--cacao);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .editie-02 footer {
    text-align: center;
    padding: 0 1rem 2.5rem;
  }
  .editie-02 footer a { color: inherit; }

  /* ---------- desktop: 3 kolommen x 2 rijen, past op het scherm ---------- */
  @media (min-width: 900px) and (orientation: landscape) {
    .editie-02 footer { padding-bottom: 1.5rem; }

    .tray {
      grid-template-columns: repeat(3, 1fr);
      /* breedte volgt de schermhoogte zodat 2 rijen altijd passen
         (2 rijen = ongeveer 0.62 x de breedte, 130px voor marges en footer) */
      width: min(92vw, 1100px, calc((100vh - 130px) / 0.62));
      margin: 1rem auto .5rem;
    }

    /* in 3 x 2 zijn de middelste stukjes 2 en 5 (middelste kolom) */
    .piece:nth-child(3) img,
    .piece:nth-child(4) img {
      --rot: 0deg;
      --fit: 1;
    }
    .piece:nth-child(2) img,
    .piece:nth-child(5) img {
      --rot: 90deg;
      --fit: .93;
    }
  }

  /* minder beweging voor wie dat liever heeft */
  @media (prefers-reduced-motion: reduce) {
    .piece img, .piece .label, .piece::before {
      transition-duration: .01s;
      transition-delay: 0s;
    }
  }
</style>
</head>

<body class="editie-02">

<main>
  <div class="tray">

    <button class="piece" type="button" aria-label="stukje 1: tiramisu">
      <img src="../beeld/tiramisupiece.png" alt="" draggable="false">
      <span class="label">
        <strong>tiramisu</strong>
        <span>betekent "trek me omhoog"</span>
      </span>
    </button>

    <button class="piece" type="button" aria-label="stukje 2: de onderste laag">
      <img src="../beeld/tiramisupiece.png" alt="" draggable="false">
      <span class="label">
        <strong>de basis</strong>
        <span>lange vingers in koffie</span>
      </span>
    </button>

    <button class="piece" type="button" aria-label="stukje 3: de room">
      <img src="../beeld/tiramisupiece.png" alt="" draggable="false">
      <span class="label">
        <strong>de room</strong>
        <span>mascarpone, ei en suiker</span>
      </span>
    </button>

    <button class="piece" type="button" aria-label="stukje 4: de cacao">
      <img src="../beeld/tiramisupiece.png" alt="" draggable="false">
      <span class="label">
        <strong>de cacao</strong>
        <span>de laatste laag, helemaal bovenop</span>
      </span>
    </button>

    <button class="piece" type="button" aria-label="stukje 5: wie maakte het">
      <img src="../beeld/tiramisupiece.png" alt="" draggable="false">
      <span class="label">
        <strong>gemaakt door</strong>
        <span>Lyna</span>
      </span>
    </button>

    <button class="piece" type="button" aria-label="stukje 6: mijn score">
      <img src="../beeld/tiramisupiece.png" alt="" draggable="false">
      <span class="label">
        <strong></strong>
        <span></span>
      </span>
    </button>

  </div>
</main>

<footer>
  <a href="../index.html">home</a>
</footer>

<script>
  // tikken op een telefoon: stukje open / dicht
  document.querySelectorAll('.piece').forEach(piece => {
    piece.addEventListener('click', () => piece.classList.toggle('open'));
  });
</script>

</body>
</html>
