<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>editie 01</title>
  <link rel="stylesheet" href="/Users/oonaderijcke/Desktop/LUCA 26:27/WEBDESIGN/Starter/style.css">
</head>
<body class="editie editie-01" data-background="0">

  <!--
    EDITIE 01. Focus: het scherm.
    Regel: alleen tekst, en de pagina vult precies één scherm, van telefoon tot beamer, zonder scrollen.

    Vervang de voorbeeldtekst door je materiaal van deze week.
    De vormgeving maak je in style.css.

    Een nieuwe editie maken: kopieer dit bestand, noem het 02.html, pas nummer, datum en inhoud aan,
    en voeg de editie toe aan de lijst in index.html.
  -->

  <header>
 
    <h1><button type="button" data-color="0" aria-label="apple crumble cake"><span class="fit-width">apple</span><span class="fit-width">crumble</span><span class="fit-width">cake</span></button></h1>
  </header>

  <main>
    <p>editie 01</p>
    <p class="ingredients-marquee"><span>2 appels, 100g bloem, 100g suiker</span></p>
  </main>

  <footer>
    <a href="/Users/oonaderijcke/Desktop/LUCA 26:27/WEBDESIGN/Starter/index.html">Overzicht</a>
  </footer>

  <script>
    const titleButton = document.querySelector("h1 button");
    const fittedWords = titleButton.querySelectorAll(".fit-width");

    titleButton.addEventListener("click", () => {
      const nextColor = (Number(titleButton.dataset.color) + 1) % 5;
      titleButton.dataset.color = nextColor;
    });

    document.addEventListener("keydown", (event) => {
      if (event.key.toLowerCase() !== "a" || event.repeat) return;

      const nextBackground = (Number(document.body.dataset.background) + 1) % 5;
      document.body.dataset.background = nextBackground;
    });

    const fitWordToWidth = () => {
      fittedWords.forEach((word) => {
        word.style.transform = `scaleX(${titleButton.clientWidth / word.offsetWidth})`;
      });
    };

    new ResizeObserver(fitWordToWidth).observe(titleButton);
    fitWordToWidth();
  </script>
</body>
</html>
