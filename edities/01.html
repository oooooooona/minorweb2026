<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>editie 01</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body class="editie-01">

  <!--
    EDITIE 01. Focus: het scherm.
    Regel: alleen tekst, en de pagina vult precies één scherm, van telefoon tot beamer, zonder scrollen.

    Vervang de voorbeeldtekst door je materiaal van deze week.
    De vormgeving maak je in style.css.

    Een nieuwe editie maken: kopieer dit bestand, noem het 02.html, pas nummer, datum en inhoud aan,
    en voeg de editie toe aan de lijst in index.html.
  -->

  <header>
    <h1>
      <button type="button" aria-label="Volgend woord">
        <span class="crumb-word is-active" data-word="APPLE" aria-hidden="true">APPLE</span>
        <span class="crumb-word" data-word="CRUMBLE" aria-hidden="true">CRUMBLE</span>
        <span class="crumb-word" data-word="CAKE" aria-hidden="true">CAKE</span>
      </button>
      <span class="visually-hidden" aria-live="polite">APPLE</span>
    </h1>
  </header>

  <footer>
    <a href="../index.html">overzicht</a>
  </footer>

  <script>
    const button = document.querySelector(".editie-01 h1 button");
    const words = [...button.querySelectorAll(".crumb-word")];
    const announcement = document.querySelector('[aria-live="polite"]');
    let activeIndex = 0;
    let cleanupTimer;

    words.forEach(word => {
      const letters = [...word.dataset.word].map((letter, index) => {
        const span = document.createElement("span");
        const cuts = count => Array.from({ length: count + 1 }, (_, point) => {
          if (point === 0 || point === count) return point * 100 / count;
          return point * 100 / count + Math.round(Math.random() * 12 - 6);
        });
        const xCuts = cuts(3);
        const yCuts = cuts(3);

        span.className = "letter";
        span.style.setProperty("--letter-index", index.toString());
        const base = document.createElement("span");
        base.className = "letter-base";
        base.textContent = letter;
        span.append(base);

        for (let row = 0; row < yCuts.length - 1; row += 1) {
          for (let column = 0; column < xCuts.length - 1; column += 1) {
            const piece = document.createElement("span");
            const left = xCuts[column];
            const right = xCuts[column + 1];
            const top = yCuts[row];
            const bottom = yCuts[row + 1];
            const inset = 1;

            piece.className = "crumb-piece";
            piece.textContent = letter;
            piece.style.clipPath = `polygon(${left + inset}% ${top}%, ${right - inset}% ${top}%, ${right}% ${top + inset}%, ${right}% ${bottom - inset}%, ${right - inset}% ${bottom}%, ${left + inset}% ${bottom}%, ${left}% ${bottom - inset}%, ${left}% ${top + inset}%)`;
            piece.style.setProperty("--crumb-x", `${Math.round(Math.random() * 100 - 50)}%`);
            piece.style.setProperty("--crumb-y", `${55 + Math.round(Math.random() * 110)}%`);
            piece.style.setProperty("--crumb-rotation", `${Math.round(Math.random() * 300 - 150)}deg`);
            piece.style.setProperty("--crumb-delay", `${index * 38 + Math.round(Math.random() * 100)}ms`);
            span.append(piece);
          }
        }

        return span;
      });
      word.replaceChildren(...letters);
    });

    button.addEventListener("click", () => {
      window.clearTimeout(cleanupTimer);
      words.forEach(word => word.classList.remove("is-leaving"));

      const currentWord = words[activeIndex];
      currentWord.classList.remove("is-active");
      currentWord.classList.add("is-leaving");

      activeIndex = (activeIndex + 1) % words.length;
      const nextWord = words[activeIndex];
      nextWord.classList.add("is-active");
      announcement.textContent = nextWord.dataset.word;

      cleanupTimer = window.setTimeout(() => {
        currentWord.classList.remove("is-leaving");
      }, 1700);
    });
  </script>

</body>
</html>
