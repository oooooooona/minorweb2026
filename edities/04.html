<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>editie 4 - wafel</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #eb5696; /* Roze achtergrondkleur */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* De container met de statische achtergrond (bord + mes + vork) */
    #bord-container {
      position: relative;
      width: 100vw;
      max-width: 1200px;
      aspect-ratio: 16 / 10; /* Pas dit aan naar de exacte verhouding van je achtergrondafbeelding */
      background-image: url('../beeld/fork.PNG');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Alle losse PNG-lagen exact op elkaar gestapeld */
    .laag {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none; /* Zorgt dat de klik altijd op de container zelf landt */
      opacity: 0;
      transition: opacity 0.2s ease; /* Zet op 0s als je een harde knip wilt zonder fade */
    }

    .laag.zichtbaar {
      opacity: 1;
    }
  </style>
</head>

<body>


  <div id="bord-container">
  
    <!-- Stap 1: De wafel (vervang src door jouw eigen PNG-bestandsnaam) -->
    <img src="../beeld/emptywafel.png" alt="" class="laag">

    <!-- Stap 2: Het ijs -->
    <img src="../beeld/ijs.png" alt="" class="laag">

    <!-- Stap 3: De bananen -->
    <img src="../beeld/banaan.png" alt="" class="laag">

    <img src="../beeld/slagroom.png" alt="" class="laag">

    <!-- Stap 4: De slagroom -->
    <img src="../beeld/wafel3.png" alt="" class="laag">
  </div>

  <script>
    const bord = document.getElementById('bord-container');
    const lagen = document.querySelectorAll('.laag');
    const klikGeluid = new Audio('../geluid/sparkle3.mp3');
    klikGeluid.preload = 'auto';
    let huidigeStap = 0;
    let richting = 1; // 1 = opbouwen, -1 = afbouwen

    function updateBord() {
      lagen.forEach((laag, index) => {
        laag.classList.toggle('zichtbaar', index < huidigeStap);
      });
    }
    bord.addEventListener('click', () => {
      klikGeluid.currentTime = 0;
      klikGeluid.play().catch((error) => {
        console.error('Het klikgeluid kon niet worden afgespeeld:', error);
      });

      huidigeStap += richting;

      // Als het bord vol is, draai de richting om naar achteruit
      if (huidigeStap >= lagen.length) {
        huidigeStap = lagen.length;
        richting = -1;
      } 
      // Als het bord weer leeg is, draai de richting om naar vooruit
      else if (huidigeStap <= 0) {
        huidigeStap = 0;
        richting = 1;
      }

      updateBord();
    });
  </script>

</body>
</html>
