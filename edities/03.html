<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>editie 03 - crêpes</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body class="editie-03">
  <main class="ingredients-layout" aria-label="Ingrediënten voor crêpes">
    <p class="painting-instructions" aria-live="polite">wat eet jij graag op je pannenkoek?</p>
    <div class="crepe-circle" aria-label="Crêpe om op te schilderen"></div>
    <button class="ingredient ingredient-butter" type="button" data-emoji="🧈" aria-label="Kies boter als schilder-emoji" aria-pressed="false">
      <img src="../beeld/BOTER.png">
    </button>
    <button class="ingredient ingredient-powdered-sugar" type="button" data-emoji="⭐️" aria-label="Kies poedersuiker als schilder-emoji" aria-pressed="false">
      <img src="../beeld/PS.png">
    </button>
    <button class="ingredient ingredient-blueberries" type="button" data-emoji="🫐" aria-label="Kies bosbessen als schilder-emoji" aria-pressed="false">
      <img src="../beeld/BLUEB.png">
    </button>
    <button class="ingredient ingredient-brown-sugar" type="button" data-emoji="🤎" aria-label="Kies bruine suiker als schilder-emoji" aria-pressed="false">
      <img src="../beeld/BS.png">
    </button>
    <button class="ingredient ingredient-jam" type="button" data-emoji="🍓" aria-label="Kies aardbeienconfituur als schilder-emoji" aria-pressed="false">
      <img src="../beeld/SBJ.png">
    </button>
    <button class="ingredient ingredient-chocolate-spread" type="button" data-emoji="🍫" aria-label="Kies chocoladehazelnootpasta als schilder-emoji" aria-pressed="false">
      <img src="../beeld/NUTELLA.png">
    </button>
  </main>
  <footer>
    <a href="../index.html">overzicht</a>
  </footer>
  <script src="../schilderen.js" defer></script>
</body>
</html>
