<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e9141c">
  <title>editie 3 - crêpes </title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      background: #f1f1f1;
      color: #ed171f;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --red: #ed171f;
      --white: #fffdfa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 3.5vh 2vw;
    }

    .scene {
      position: relative;
      width: min(94vw, 105vh, 1400px);
      aspect-ratio: 1.19;
      overflow: hidden;
      background: var(--white) url("../beeld/image%206.png") center / cover no-repeat;
      box-shadow: 0 2px 16px rgb(0 0 0 / 8%);
      isolation: isolate;
    }

    h1 {
      position: absolute;
      z-index: 3;
      top: 40%;
      left: 10.5%;
      margin: 0;
      color: var(--red);
      font-size: clamp(1.5rem, 3.4vw, 3.5rem);
      font-weight: 900;
      letter-spacing: -0.07em;
      line-height: 1;
      transform: rotate(-7deg);
      -webkit-text-stroke: 0.1em var(--white);
      paint-order: stroke fill;
      text-shadow: 2px 3px 0 var(--white);
    }

    .crepe {
      position: absolute;
      z-index: 1;
      display: block;
      width: 46%;
      height: auto;
      pointer-events: none;
      user-select: none;
    }

    .desktop-crepe-one {
      top: -2%;
      left: -7%;
      transform: rotate(-10deg);
    }

    .desktop-crepe-two {
      top: 2%;
      left: 62%;
      transform: rotate(9deg);
    }

    .desktop-crepe-three {
      top: 34%;
      left: 28%;
      transform: rotate(-5deg);
    }

    .favorites {
      position: absolute;
      z-index: 4;
      right: 4%;
      bottom: 7%;
      left: 4%;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 3%;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .favorite {
      position: relative;
      aspect-ratio: 1;
      perspective: 1000px;
    }

    .plate-card {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--red);
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 650ms cubic-bezier(0.2, 0.75, 0.25, 1);
      -webkit-tap-highlight-color: transparent;
    }

    .plate-card:focus-visible {
      outline: 3px solid var(--red);
      outline-offset: 5px;
    }

    .plate-card.is-flipped {
      transform: rotateY(180deg);
    }

    .plate-face {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 50%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .plate-front img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
    }

    .plate-back {
      transform: rotateY(180deg);
    }

    .plate-back img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
    }

    .plate-back .favorite-name {
      position: absolute;
      inset: 27% 19%;
      display: grid;
      place-content: center;
      padding: 0.2rem;
      color: var(--red);
    }

    .favorite-name {
      position: relative;
      z-index: 1;
      max-width: 95%;
      font-size: clamp(0.68rem, 1.2vw, 1rem);
      font-weight: 600;
      line-height: 1.3;
      text-align: center;
    }

    .mobile-crepe {
      display: none;
    }

    @media (max-width: 700px) {
      :root {
        color-scheme: dark;
        background: var(--red);
      }

      body {
        display: block;
        padding: 0;
        background: var(--red);
        color: var(--white);
      }

      .scene {
        width: 100%;
        min-height: 100svh;
        aspect-ratio: auto;
        display: flow-root;
        overflow: hidden;
        background: var(--red);
        box-shadow: none;
      }

      h1 {
        top: 4%;
        left: 7%;
        color: var(--white);
        font-size: clamp(1.4rem, 7vw, 2.1rem);
        letter-spacing: -0.03em;
        transform: none;
        -webkit-text-stroke: 0;
        text-shadow: none;
      }

      .desktop-crepe-one,
      .desktop-crepe-two,
      .desktop-crepe-three {
        display: none;
      }

      .mobile-crepe {
        display: block;
        width: 39%;
      }

      .mobile-crepe-one {
        top: 12svh;
        left: 36%;
      }

      .mobile-crepe-two {
        top: 27svh;
        left: -12%;
      }

      .mobile-crepe-three {
        top: 41svh;
        left: 7%;
      }

      .mobile-crepe-four {
        top: 61svh;
        left: 56%;
      }

      .mobile-crepe-five {
        top: 80svh;
        left: -6%;
      }

      .favorites {
        position: relative;
        inset: auto;
        width: min(78vw, 360px);
        grid-template-columns: 1fr;
        gap: 1.25rem;
        margin: 60svh auto 2rem;
      }

      .favorite {
        min-width: 0;
        width: 100%;
      }

      .favorite-name {
        font-size: clamp(0.9rem, 4vw, 1.15rem);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .plate-card {
        transition-duration: 0.01ms;
      }
    }
  </style>
</head>
<body>
  <main class="scene" aria-labelledby="page-title">

    <img class="crepe desktop-crepe-one" src="../beeld/image%203.png" alt="" aria-hidden="true">
    <img class="crepe desktop-crepe-two" src="../beeld/image%203.png" alt="" aria-hidden="true">
    <img class="crepe desktop-crepe-three" src="../beeld/image%203.png" alt="" aria-hidden="true">

    <img class="crepe mobile-crepe mobile-crepe-one" src="../beeld/image%203.png" alt="" aria-hidden="true">
    <img class="crepe mobile-crepe mobile-crepe-two" src="../beeld/image%203.png" alt="" aria-hidden="true">
    <img class="crepe mobile-crepe mobile-crepe-three" src="../beeld/image%203.png" alt="" aria-hidden="true">
    <img class="crepe mobile-crepe mobile-crepe-four" src="../beeld/image%203.png" alt="" aria-hidden="true">
    <img class="crepe mobile-crepe mobile-crepe-five" src="../beeld/image%203.png" alt="" aria-hidden="true">

    <ol class="favorites" aria-label="Mijn drie favoriete toppings">
      <li class="favorite">
        <button class="plate-card" type="button" aria-pressed="false" aria-label="Toon topping 1: boter + bruine suiker">
          <span class="plate-face plate-front" aria-hidden="false">
            <img src="../beeld/image%2010.png" alt="">
          </span>
          <span class="plate-face plate-back" aria-hidden="true">
            <img src="../beeld/image%2010.png" alt="">
            <span class="favorite-name">topping 1<br>boter + bruine suiker</span>
          </span>
        </button>
      </li>
      <li class="favorite">
        <button class="plate-card" type="button" aria-pressed="false" aria-label="Toon topping 2: aardbeienconfituur">
          <span class="plate-face plate-front" aria-hidden="false">
            <img src="../beeld/image%2010.png" alt="">
          </span>
          <span class="plate-face plate-back" aria-hidden="true">
            <img src="../beeld/image%2010.png" alt="">
            <span class="favorite-name">topping 2<br>aardbeienconfituur</span>
          </span>
        </button>
      </li>
      <li class="favorite">
        <button class="plate-card" type="button" aria-pressed="false" aria-label="Toon topping 3: poedersuiker">
          <span class="plate-face plate-front" aria-hidden="false">
            <img src="../beeld/image%2010.png" alt="">
          </span>
          <span class="plate-face plate-back" aria-hidden="true">
            <img src="../beeld/image%2010.png" alt="">
            <span class="favorite-name">topping 3<br>poedersuiker</span>
          </span>
        </button>
      </li>
    </ol>
  </main>
  <script>
    document.querySelectorAll(".plate-card").forEach((button) => {
      const front = button.querySelector(".plate-front");
      const back = button.querySelector(".plate-back");
      const topping = button.querySelector(".favorite-name").textContent.replace(/^topping \d+/i, "").trim();
      const number = button.getAttribute("aria-label").match(/topping \d+/i)[0];

      button.addEventListener("click", () => {
        const isFlipped = button.classList.toggle("is-flipped");
        button.setAttribute("aria-pressed", String(isFlipped));
        button.setAttribute("aria-label", isFlipped ? `${number}: ${topping}` : `Toon ${number}: ${topping}`);
        front.setAttribute("aria-hidden", String(isFlipped));
        back.setAttribute("aria-hidden", String(!isFlipped));
      });
    });
  </script>
</body>
</html>
